<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Online Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .btn-primary { background: #667eea; border: none; }
        .btn-primary:hover { background: #5a6fd8; }
        .nav-tabs .nav-link.active { background-color: #667eea; color: white; border-color: #667eea; }
        .btn-outline-danger:hover { background-color: #dc3545; color: white; }
        .btn-outline-primary:hover { background-color: #0d6efd; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card p-4">
                    <div class="text-center mb-4">
                        <i class="fas fa-book fa-3x text-primary"></i>
                        <h2 class="mt-3">Library Login</h2>
                    </div>
                    <ul class="nav nav-tabs" id="loginTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="user-tab" data-bs-toggle="tab" data-bs-target="#user" type="button" role="tab" aria-controls="user" aria-selected="true">User Login</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="admin-tab" data-bs-toggle="tab" data-bs-target="#admin" type="button" role="tab" aria-controls="admin" aria-selected="false">Admin Login</button>
                        </li>
                    </ul>
                    <div class="tab-content mt-3" id="loginTabsContent">
                        <div class="tab-pane fade show active" id="user" role="tabpanel" aria-labelledby="user-tab">
                            <p class="text-muted">Login as a regular user to browse and borrow books.</p>
                            <form action="/login" method="post">
                                <div class="mb-3">
                                    <label for="username-user" class="form-label"><i class="fas fa-user"></i> Username</label>
                                    <input type="text" class="form-control" id="username-user" name="username" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password-user" class="form-label"><i class="fas fa-lock"></i> Password</label>
                                    <input type="password" class="form-control" id="password-user" name="password" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Login as User</button>
                            </form>
                            <div class="text-center mt-3">
                                <a href="/register" class="text-decoration-none">Don't have an account? Register</a><br>
                                <a href="/forgot_password" class="text-decoration-none">Forgot Password?</a>
                            </div>
                            <div class="text-center mt-3">
                                <p>Or login with:</p>
                                <a href="/login/google" class="btn btn-outline-danger me-2"><i class="fab fa-google"></i> Google</a>
                                <a href="/login/microsoft" class="btn btn-outline-primary"><i class="fab fa-microsoft"></i> Microsoft</a>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="admin" role="tabpanel" aria-labelledby="admin-tab">
                            <p class="text-muted">Login as an admin to manage books and users.</p>
                            <form action="/login" method="post">
                                <div class="mb-3">
                                    <label for="username-admin" class="form-label"><i class="fas fa-user-shield"></i> Username</label>
                                    <input type="text" class="form-control" id="username-admin" name="username" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password-admin" class="form-label"><i class="fas fa-lock"></i> Password</label>
                                    <input type="password" class="form-control" id="password-admin" name="password" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Login as Admin</button>
                            </form>
                            <div class="text-center mt-3">
                                <a href="/forgot_password" class="text-decoration-none">Forgot Password?</a>
                            </div>
                            <div class="text-center mt-3">
                                <p>Or login with:</p>
                                <a href="/login/google" class="btn btn-outline-danger me-2"><i class="fab fa-google"></i> Google</a>
                                <a href="/login/microsoft" class="btn btn-outline-primary"><i class="fab fa-microsoft"></i> Microsoft</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', function(e) {
                const username = form.querySelector('input[name="username"]').value.trim();
                const password = form.querySelector('input[name="password"]').value.trim();
                if (!username || !password) {
                    alert('Please fill in all fields.');
                    e.preventDefault();
                }
            });
        });
    </script>
</body>
</html>
