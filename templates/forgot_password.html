<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Online Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #f5576c, #4facfe, #00f2fe);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="1" fill="rgba(255,255,255,0.1)"/></svg>') repeat;
            animation: float 20s linear infinite;
            pointer-events: none;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-100px); }
        }
        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.95);
            animation: cardFadeIn 1s ease-out;
            position: relative;
            z-index: 1;
        }
        @keyframes cardFadeIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            border-radius: 25px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        .btn-primary:hover::before {
            left: 100%;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .form-control {
            border-radius: 10px;
            border: 2px solid #ddd;
            transition: all 0.3s ease;
            animation: inputSlideIn 0.8s ease-out;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            transform: scale(1.02);
        }
        .input-group-text {
            background: linear-gradient(45deg, #f8f9fa, #e9ecef);
            border-radius: 10px 0 0 10px;
            color: #667eea;
            transition: color 0.3s ease;
        }
        .input-group:focus-within .input-group-text {
            color: #764ba2;
        }
        .alert {
            border-radius: 10px;
            animation: alertSlideIn 0.5s ease-out;
        }
        @keyframes alertSlideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .fa-key {
            color: #667eea;
            animation: iconBounce 2s infinite;
        }
        @keyframes iconBounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        .text-primary {
            color: #667eea !important;
            transition: color 0.3s ease;
        }
        .text-primary:hover {
            color: #764ba2 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card p-4">
                    <div class="text-center mb-4">
                        <i class="fas fa-key fa-3x text-primary animate__animated animate__bounce"></i>
                        <h2 class="mt-3 text-dark animate__animated animate__fadeInDown">Forgot Password</h2>
                        <p class="text-muted animate__animated animate__fadeInUp">Enter your username or email to reset your password.</p>
                    </div>
                    {% with messages = get_flashed_messages() %}
                    {% if messages %}
                    <div class="alert alert-info">{{ messages[0] }}</div>
                    {% endif %}
                    {% endwith %}
                    <form method="post" id="forgotForm">
                        <div class="mb-3">
                            <label for="identifier" class="form-label fw-bold"><i class="fas fa-user"></i> Username or Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" class="form-control" id="identifier" name="identifier" required aria-describedby="identifierHelp">
                            </div>
                            <div id="identifierHelp" class="form-text">We'll send a reset code to your email.</div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Send Reset Code</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="/login" class="text-decoration-none text-primary fw-bold">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            const identifier = document.getElementById('identifier').value.trim();
            if (!identifier) {
                alert('Please enter your username or email.');
                e.preventDefault();
                return;
            }
            // Add loading animation
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            btn.disabled = true;
            setTimeout(() => {
                btn.innerHTML = 'Send Reset Code';
                btn.disabled = false;
            }, 2000);
        });
    </script>
</body>
</html>
